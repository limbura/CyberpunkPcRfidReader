name: Publish library release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    name: Tests / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r wcopy_reader_package/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q wcopy_reader_package scripts
      - name: Run full unit test suite (including ZIP builder)
        working-directory: wcopy_reader_package
        run: python -m unittest discover -s tests_and_other -p "test_*.py" -v

  publish:
    name: Verify tag, build ZIP and publish Release
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify tagged commit belongs to master
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/master
      - name: Validate tag and build release archive
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python scripts/build_release.py --tag "$RELEASE_TAG" --output-dir dist
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/wcopy_reader_package_$RELEASE_TAG.zip" \
            "dist/wcopy_reader_package_$RELEASE_TAG.sha256" \
            --verify-tag \
            --title "wcopy_reader $RELEASE_TAG" \
            --generate-notes
