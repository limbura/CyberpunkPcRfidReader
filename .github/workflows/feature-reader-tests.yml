name: Feature Cyb reader tests

on:
  push:
    branches:
      - feature/cyb-nfctool-reader

jobs:
  unittest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install HID dependency
        run: python -m pip install -r wcopy_reader_package/requirements.txt
      - name: Run hardware-free wCopy and Cyb unit tests
        working-directory: wcopy_reader_package
        run: python -m unittest discover -s tests_and_other -p "test_*.py" -v
