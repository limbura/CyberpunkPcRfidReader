name: Reader regression tests

on:
  push:
    branches:
      - master
      - feature/cyb-nfctool-reader
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install HID dependency
        run: python -m pip install -r wcopy_reader_package/requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q wcopy_reader_package
      - name: Run wCopy and Cyb regression tests (no physical hardware)
        working-directory: wcopy_reader_package
        run: python -m unittest discover -s tests_and_other -p "test_*.py" -v
